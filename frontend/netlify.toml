[build]
  command = "node prune-routes.js && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SKIP_BUILD_CACHE = "true"
  PRISMA_GENERATE_SKIP_ENGINES = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["canvas"]
  included_files = [
    "!.next/cache/**",
    "node_modules/.prisma/client/schema.prisma",
    "!node_modules/@next/**",
    "!node_modules/@prisma/engines/**",
    "!node_modules/@playwright/**",
    "!node_modules/playwright/**",
    "!node_modules/playwright-core/**",
    "!node_modules/@img/**",
    "!node_modules/sharp/**",
    "!node_modules/.cache/**",
    "!node_modules/typescript/**",
    "!node_modules/prisma/**",
    "!node_modules/eslint/**",
    "!node_modules/@eslint/**"
  ]

# Standalone Function CDN Rewrites
[[redirects]]
  from = "/api/v1/files/:id/process"
  to = "/.netlify/functions/process-pdf-background?fileId=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/registers/upload-sales/:id"
  to = "/.netlify/functions/upload-sales?engagementId=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/registers/upload-gstr2b/:id"
  to = "/.netlify/functions/upload-gstr2b?engagementId=:id"
  status = 200
  force = true

# Cache control for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
